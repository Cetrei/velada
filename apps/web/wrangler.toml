name = "velada-lol"
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-04-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain: velada.cetrei.dev debe existir como zona (cetrei.dev) en la
# misma cuenta de Cloudflare. Wrangler crea el registro DNS y el binding
# automaticamente en cada deploy. El token de CI necesita permisos de Zone
# (Workers Routes: Edit, DNS: Edit) ademas de Account (Workers Scripts: Edit).
routes = [
  { pattern = "velada.cetrei.dev", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# dist/_worker.js/ es el codigo del Worker (ya declarado arriba como `main`),
# no un asset publico. Sin apps/web/public/.assetsignore (copiado a dist/ en
# cada build), Wrangler escanea ./dist completo, encuentra _worker.js/ ahi
# dentro y aborta el deploy con "Uploading a Pages _worker.js directory as
# an asset". Ver apps/web/public/.assetsignore.

[vars]
# PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY are injected at build time
# via GitHub Actions secrets, not here. Local dev uses apps/web/.env instead.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1