# Participantes "de meme": aparecen en el roster/grid de seleccion como
# cualquier otro peleador (foto, banner, stats, ficha publica), pero NUNCA
# cuentan para nada competitivo -- no entran en la ruleta, no se los puede
# elegir para un combate 1v1 ni para generar/balancear team matches, y no
# aparecen en tallies de pronosticos. Viven SOLO aca, nunca en Supabase
# (no hay forma de crear/editar uno desde /inscripcion ni desde el panel
# de admin -- es intencional, evita que alguien marque su propia cuenta
# real como "no cuenta").
#
# performanceScores es obligatorio ponerlo a mano aca (6 numeros, mismo
# formato/escala que mmradar.gg: laning, farming, objectives, combat,
# teamfight, vision) porque estos participantes no tienen lolUsername
# real -- no hay ningun perfil de mmradar que consultar para ellos.
#
# El resto de los campos usa el mismo formato que participants.yml.
#
# Campos extra 100% de meme (memeTitles, memeIconUrl, memeFakeMatch,
# memeFakeTeamMatch): SOLO se muestran en la ficha publica de este
# participante puntual (peleadores/[id].astro), nunca en /combates,
# /sorteo, el balanceador de equipos, ni en ningun otro listado -- son de
# broma, no representan combates reales del evento. Ninguno es
# obligatorio; lo que no se pone a mano simplemente no se dibuja en la
# ficha.

